<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal website of Yuanhao Dong">
  <title>Yuanhao Dong</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #eef2ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.32), transparent 35rem),
        radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.24), transparent 30rem),
        #0b1020;
    }

    main {
      width: min(42rem, 100%);
      padding: clamp(2rem, 8vw, 4rem);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 1.5rem;
      background: rgba(17, 24, 39, 0.78);
      box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: #7dd3fc;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 10vw, 5.4rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    p:last-child {
      max-width: 32rem;
      margin: 1.5rem 0 0;
      color: #cbd5e1;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Hello, world.</p>
    <h1>Yuanhao Dong</h1>
  </main>
</body>
</html>
